plugins {
	id 'net.fabricmc.fabric-loom'
}

// staffcore-discord: the Discord companion to StaffCore.
//
// A jar of its own, for three reasons in this order. JDA and what it pulls in are large, and a
// server that does not want Discord should not ship them. A bot crash, a rate limit or a Discord
// outage must not be able to take moderation down. And it forces StaffCore to have a real API,
// which is worth having regardless: this project may only use StaffCore through
// io.github.alphain24.staffcore.api, and a test fails the build if it reaches past it.

version = project.discord_mod_version
group = project.maven_group

base {
	archivesName = 'staffcore-discord'
}

repositories {
	mavenCentral()
}

loom {
	runs {
		server {
			runDir = "../run/discord-server"
		}
	}
}

// Everything JDA resolves to, compiled against and nested into the jar one module at a time.
// Loom's include is not transitive, so the resolved set is listed rather than guessed at.
configurations {
	bundle
	implementation.extendsFrom bundle
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// StaffCore itself. Needed at compile time for the api package and at runtime in the
	// development server; never bundled — server owners install StaffCore as its own jar.
	implementation project(':')

	// JDA, nested into the jar with what it needs at runtime. Voice is not used, so the audio
	// codec and the encryption library voice needs are left out; the game already provides SLF4J.
	bundle("net.dv8tion:JDA:${project.jda_version}") {
		exclude module: 'opus-java'
		exclude module: 'tink'
		exclude group: 'org.slf4j'
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

afterEvaluate {
	configurations.bundle.resolvedConfiguration.resolvedArtifacts.each { artifact ->
		def id = artifact.moduleVersion.id
		dependencies.add('include', "${id.group}:${id.name}:${id.version}")
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat = "full"
	}
}

// Gate 5: the token appears in nothing the tests wrote. Several tests hand the test token to loggers,
// exceptions and status lines on purpose, the way a careless library would; each checks what it
// captured, and this reads what Gradle captured: every report, result file and line of output.
// The token is built the way BotTokenTest.FAKE builds it, so no token-shaped literal is in the repo.
def testToken = {
	(0..2).collect { part ->
		(0..<(part == 1 ? 6 : 30)).collect { i -> (char) ((int) 'a'.charAt(0) + (i * 7 + part) % 26) }.join('')
	}.join('.')
}

tasks.register('checkTestOutputForToken') {
	description = 'Fails when the test token appears in anything the tests wrote.'
	def roots = [layout.buildDirectory.dir('test-results').get().asFile,
			layout.buildDirectory.dir('reports/tests').get().asFile]
	doLast {
		// The first part of the token, so a line that kept only part of it is caught too.
		String needle = testToken().substring(0, 26)
		def carrying = []
		int read = 0
		roots.findAll { it.exists() }.each { root ->
			root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
				read++
				if (new String(file.bytes, 'ISO-8859-1').contains(needle)) carrying << root.toPath().relativize(file.toPath())
			}
		}
		if (read == 0) throw new GradleException('No test output was found to search, so the token check proves nothing.')
		if (!carrying.isEmpty()) {
			throw new GradleException("The test token appears in test output: ${carrying}. Something logged, printed or "
					+ "reported it; find it before it happens with a real one.")
		}
		logger.lifecycle("Token check: {} test output file(s) searched, the token is in none.", read)
	}
}
tasks.named('test') { finalizedBy 'checkTestOutputForToken' }

processResources {
	def v = project.version
	inputs.property "version", v
	filesMatching("fabric.mod.json") {
		expand "version": v
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
