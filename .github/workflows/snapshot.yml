name: Snapshot canary

# The same boot check against the newest Minecraft and Fabric API available, rather than the
# versions pinned in gradle.properties.
#
# Expected to fail sometimes, and that is the point: a snapshot that moves an injection point
# should surface here, on a schedule, rather than on somebody's server the week the release
# lands. It never blocks a merge — it opens an issue.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Point the build at the latest snapshot
        id: bump
        run: |
          set -euo pipefail
          LATEST=$(curl -sf https://launchermeta.mojang.com/mc/game/version_manifest_v2.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["snapshot"])')
          echo "Latest snapshot: ${LATEST}"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          sed -i "s/^minecraft_version=.*/minecraft_version=${LATEST}/" gradle.properties

      - name: Boot against it
        id: boot
        continue-on-error: true
        run: bash .github/scripts/boot-check.sh boot.log 900

      - name: Upload the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-boot-log
          path: boot.log
          retention-days: 14

      - name: Open an issue if it broke
        if: steps.boot.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.bump.outputs.version }}';
            const title = `Snapshot ${version} breaks StaffCore`;

            // One issue per snapshot, reopened rather than duplicated.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: 'snapshot-canary'
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Already reported.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['snapshot-canary'],
              body: [
                `The boot check failed against Minecraft \`${version}\`.`,
                '',
                'Either a hooked method moved or a mixin stopped applying. The boot log is',
                'attached to [this run](' +
                  `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                  `/actions/runs/${context.runId}) as \`snapshot-boot-log\`.`,
                '',
                'This does not affect the pinned release; it is early warning only.'
              ].join('\n')
            });
