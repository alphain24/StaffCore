name: Release

# Builds the jar and attaches it to a GitHub release when a version tag is pushed.
#
# The jar that ships is the one CI built, not one from somebody's laptop. That is the whole
# point of doing it here: a locally built jar carries whatever was in that working tree, and
# nobody can tell afterwards.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and test
        run: ./gradlew build --stacktrace

      # A release that fails its own boot check is not a release. This is the same check the
      # push builds run, repeated here so a tag cannot skip it.
      - name: Prove it boots
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          bash .github/scripts/boot-check.sh boot.log 420

      - name: Run the game tests
        run: |
          mkdir -p run/gametest
          echo "eula=true" > run/gametest/eula.txt
          ./gradlew runGametest

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
          generate_release_notes: true
          draft: true
          body_path: .github/RELEASE_TEMPLATE.md
