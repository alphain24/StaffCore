name: Build

# Every push and pull request. This is the fast lane — compile plus the JUnit suite, which
# needs no Minecraft bootstrap and finishes in seconds.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        # The wrapper is a checked-in jar that every build on every machine executes before
        # any of this repository's own code runs. A swapped wrapper is the quietest supply
        # chain there is, so its checksum is matched against Gradle's published list before
        # it is allowed to run.
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          # Loom's cache holds the decompiled/remapped Minecraft jar. Without it every run
          # re-downloads and re-processes it, which dwarfs the actual build.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: staffcore
          path: build/libs/*.jar
          retention-days: 14
