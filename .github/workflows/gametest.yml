name: Game tests

# Runtime verification. build.yml proves the code compiles and the headless logic is right;
# boot.yml proves every hook attached. Neither proves a feature behaves — a mixin can apply
# perfectly to a method whose logic no longer does what the feature needs, which is exactly
# how the vanish collision hook sat broken while the health check reported it present.
#
# This boots a real server, runs every @GameTest against real players, mobs and blocks, and
# fails the build if any of them fail.
on:
  push:
  pull_request:
  schedule:
    # Weekly, so a Fabric or Minecraft change that breaks behaviour without breaking the
    # build surfaces on a schedule rather than on somebody's server.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept the EULA for the test server
        run: |
          mkdir -p run/gametest
          echo "eula=true" > run/gametest/eula.txt

      - name: Run the game tests
        run: ./gradlew runGametest --stacktrace

      - name: Upload the game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-results
          path: build/gametest-results.xml
          retention-days: 7
          if-no-files-found: ignore
