plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// sqlite-jdbc lives on Maven Central. Loom adds the Minecraft/Fabric repos itself.
	mavenCentral()
}

// Gametests live in their own source set and ship in nothing.
//
// They have to run *inside* a real server, which means they need to be on the mod classpath
// at runtime — so they cannot live in src/test. Keeping them out of src/main as well means
// the release jar never carries test code, and the testmod that registers them is a separate
// mod id that only exists in the development runtime.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// Server-only mod: no client source set, no split environments.
	runs {
		server {
			runDir = "run/server"
		}

		// Boots a real server, runs every @GameTest, writes JUnit XML and exits with a
		// failure code if any of them fail. This is the only thing in the project that
		// exercises vanish, the vault or the maintenance kick against a running game rather
		// than reasoning about them.
		gametest {
			server()
			name = "Game Test"
			source = sourceSets.gametest
			runDir = "run/gametest"

			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-results.xml"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No `mappings` line on purpose — Minecraft 26.x is shipped unobfuscated.

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Nested into the built jar so server owners only ever drop in one file.
	include implementation("org.xerial:sqlite-jdbc:${project.sqlite_version}")

	// Test-scope only — nothing here ships in the jar.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// The gametest source set sees everything the mod sees, and nothing sees it.
	gametestImplementation sourceSets.main.output
}

// Let the boot check ask the mod to prove itself: -Pselftest turns on the self test that
// runs once the server has finished starting.
tasks.named('runServer') {
	if (project.hasProperty('selftest')) {
		jvmArgs '-Dstaffcore.selftest=true'
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat = "full"
	}
}

// Gametests are compiled by `check`, even though running them needs a server.
//
// They live outside src/test, so nothing in the ordinary build touched them: a signature
// change in main left `./gradlew build` green and broke the gametests silently, and the only
// thing that noticed was the nightly workflow. Compiling them here costs a few seconds and
// turns that into a compile error at the moment the signature changes.
tasks.named('check') {
	dependsOn tasks.named('compileGametestJava')
}

processResources {
	def v = project.version
	inputs.property "version", v

	filesMatching("fabric.mod.json") {
		expand "version": v
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
